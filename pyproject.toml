[project]
name = "retrieval-ops"
version = "0.1.0"
description = "Evidence-grounded RAG reliability system with hybrid retrieval, provenance, and safe answer control."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.8,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
retrievalops = "retrievalops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
